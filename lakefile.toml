name = "MathProof"
version = "0.1.0"
keywords = ["math"]
# Default targets = the light modules only (kept in sync with the CI build
# list in .github/workflows/lean_action_ci.yml): a bare `lake build` (CI,
# Reservoir's automated builder, downstream consumers) must never pull the
# heavy kernel-decide modules (MathProof.Tau.LehmerMod ~6 GB, LehmerPacked
# ~63 GiB, LehmerPow32 ~144 GiB and their dependents) nor the root
# `MathProof.lean` / `MathProof.AxCheck` (AxCheck transitively imports
# LehmerMod).  Those are built explicitly on Modal; see AGENTS.md.
defaultTargets = [
  "MathProof.Tau.Basic",
  "MathProof.Tau.Lehmer",
  "MathProof.Tau.CongruenceSmall",
  "MathProof.Tau.Bridge",
  "MathProof.ModularForms.Weight12",
  "MathProof.ModularForms.Congruence691",
  "MathProof.ModularForms.HeckeLevelOne",
  "MathProof.Tau.Mordell",
  "MathProof.Tau.LehmerUnbounded",
  "MathProof.Tau.PowChain",
  "MathProof.Tau.LehmerSieve691",
  "MathProof.Tau.LehmerPrimeReduction",
  "MathProof.ModularForms.BernoulliHigh",
  "MathProof.ModularForms.EigenLevelOne",
  "MathProof.ModularForms.LehmerWeight16",
  "MathProof.ModularForms.LehmerWeight18",
  "MathProof.ModularForms.LehmerWeight20",
  "MathProof.ModularForms.LehmerWeight22",
]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # no Mathlib-contribution copyright headers in this project
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc1"

[[lean_lib]]
name = "MathProof"
allowNonModules = true # classic-style files; suppresses the "consider module" warning

# Scaling-study benchmarks (see Bench/README.md) — deliberately OUTSIDE the
# proof library: never imported by MathProof.lean, never built by the default
# target or CI.  Build explicitly, e.g.
#   lake build Bench.Packed.BBenchPackedBal
[[lean_lib]]
name = "Bench"
allowNonModules = true
