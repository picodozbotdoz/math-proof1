name = "MathProof"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["MathProof"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # no Mathlib-contribution copyright headers in this project
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc1"

[[lean_lib]]
name = "MathProof"
allowNonModules = true # classic-style files; suppresses the "consider module" warning
