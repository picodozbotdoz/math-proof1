name = "MathProof"
version = "0.1.0"
keywords = ["math"]
# Default targets = the light modules only (kept in sync with the CI build
# list in .github/workflows/lean_action_ci.yml): a bare `lake build` (CI,
# Reservoir's automated builder, downstream consumers) must never pull the
# heavy kernel-decide modules (MathProof.Tau.LehmerMod ~6 GB, LehmerPacked
# ~63 GiB, LehmerPow32 ~144 GiB and their dependents) nor the root
# `MathProof.lean` / `MathProof.AxCheck` (AxCheck transitively imports
# LehmerMod).  Those are built explicitly on Modal; see AGENTS.md.
defaultTargets = [
  "MathProof.Tau.Basic",
  "MathProof.Tau.Lehmer",
  "MathProof.Tau.CongruenceSmall",
  "MathProof.Tau.Bridge",
  "MathProof.ModularForms.Weight12",
  "MathProof.ModularForms.Congruence691",
  "MathProof.ModularForms.HeckeLevelOne",
  "MathProof.Tau.Mordell",
  "MathProof.Tau.LehmerUnbounded",
  "MathProof.Tau.PowChain",
  "MathProof.Tau.LehmerSieve691",
  "MathProof.Tau.LehmerPrimeReduction",
  "MathProof.Tau.LehmerCoverageCount",
  "MathProof.ModularForms.BernoulliHigh",
  "MathProof.ModularForms.EigenLevelOne",
  "MathProof.ModularForms.LehmerWeight16",
  "MathProof.ModularForms.LehmerWeight18",
  "MathProof.ModularForms.LehmerWeight20",
  "MathProof.ModularForms.LehmerWeight22",
  "MathProof.ModularForms.LehmerWeight26",
  "MathProof.ModularForms.MaedaWeight24",
  "MathProof.ModularForms.MaedaLevelOne",
  "MathProof.ModularForms.MaedaSmallWeights",
  "MathProof.ModularForms.MaedaGalois",
  "MathProof.ModularForms.MaedaDim4",
  "MathProof.ModularForms.MaedaDim4Weights",
  "MathProof.ModularForms.MaedaGalois4",
  "MathProof.ModularForms.MaedaDim5",
  "MathProof.ModularForms.MaedaDim5Weights",
  "MathProof.ModularForms.Poly5",
  "MathProof.ModularForms.MaedaGalois5Defs",
  "MathProof.ModularForms.HornerCert",
  "MathProof.ModularForms.MaedaCertC",
  "MathProof.ModularForms.MaedaPermCriterion",
  "MathProof.ModularForms.CharpolyEngine",
  "MathProof.ModularForms.RabinCert",
  "MathProof.ModularForms.HeckeAlgebraQT2",
  "MathProof.ModularForms.CharpolyDimN",
  "MathProof.ModularForms.MaedaDim6Weights",
  "MathProof.ModularForms.MaedaDim7Weights",
  "MathProof.ModularForms.MaedaDim8Weights",
  "MathProof.ModularForms.MaedaDim9Weights",
  "MathProof.ModularForms.MaedaDim10Weights",
  "MathProof.ModularForms.HeckeCommute",
  "MathProof.ModularForms.HeckeGeneratedByT2",
  "MathProof.ModularForms.HeckeGeneratedByT2Weights",
  "MathProof.ModularForms.HeckeTM",
  "MathProof.ModularForms.HeckeTPCoeff",
  "MathProof.ModularForms.MaedaCertCExt",
  "MathProof.ModularForms.MaedaT3Dim6Weights",
  "MathProof.ModularForms.MaedaT3Dim7Weights",
  "MathProof.ModularForms.MaedaT3Dim8Weights",
  "MathProof.ModularForms.MaedaT3Dim9Weights",
  "MathProof.ModularForms.MaedaT3Dim10Weights",
  # HeckeRational: `T₃ ∈ ℚ[T₂]` constructive witnesses.  The generic module
  # + the 30-weight dims 6-10 file are default/CI items (37 s + 130 s on a
  # warm Modal cache, ≈ 3 min CI add).  The 24-weight small sibling
  # (HeckeRationalSmallWeights) follows its parent MaedaT3SmallWeights:
  # root-only registration, NOT a default/CI item (it would drag the parent
  # into CI; it is verified on Modal, 40 s).
  "MathProof.ModularForms.HeckeRational",
  "MathProof.ModularForms.HeckeRationalWeights",
  # HeckeIndex (iteration 23): the index [𝕋 : ℤ[T₂]] — generic layer + the
  # 54-weight instance file.  The generic module is a default/CI item
  # (~40 s on a warm Modal cache); the 54-weight file HeckeIndexWeights is
  # root-only like its data sources' siblings (its decides ride the dim
  # files that are already CI items; the file itself is verified on Modal).
  "MathProof.ModularForms.HeckeIndex",
  # MaedaT3SmallWeights (T₃ stretch, dims 2–5) is deliberately NOT a default
  # target / CI item: the five T₂ dim files already cost CI ≈ 36 min per push
  # and the five T₃ dim files add a comparable amount, so paying the 24-weight
  # stretch file (bonus content; 125 s / 6.8 GiB on Modal, likely a few min on
  # CI) on every push is not justified.  It IS a light module and is
  # registered in the root `MathProof.lean` (so `AxCheckDecide` audits its
  # decide certificates); it is verified on Modal and locally:
  #   lake build MathProof.ModularForms.MaedaT3SmallWeights
  # Its Galois twin MaedaT3GaloisSmallWeights (Gal = Sₙ for the T₃ charpolys
  # of the same 24 weights, generated by tools/gen_galoisfull.py --prime 3
  # --small) is root-only for the same reason — it imports the non-CI
  # MaedaT3SmallWeights, so a default-target registration would drag the
  # parent into every push.  (MaedaGaloisQuad, the degree-2 infra it shares,
  # IS a default target: it is Mathlib-only.)
  "MathProof.ModularForms.FrobeniusCycleType",
  "MathProof.ModularForms.JordanPrimitive",
  "MathProof.ModularForms.MaedaGaloisFull",
  "MathProof.ModularForms.MaedaGaloisQuad",
  "MathProof.ModularForms.MaedaGaloisDim6Weights",
  "MathProof.ModularForms.MaedaGaloisDim7Weights",
  "MathProof.ModularForms.MaedaGaloisDim8Weights",
  "MathProof.ModularForms.MaedaGaloisDim9Weights",
  "MathProof.ModularForms.MaedaGaloisDim10Weights",
  "MathProof.ModularForms.MaedaT3GaloisDim6Weights",
  "MathProof.ModularForms.MaedaT3GaloisDim7Weights",
  "MathProof.ModularForms.MaedaT3GaloisDim8Weights",
  "MathProof.ModularForms.MaedaT3GaloisDim9Weights",
  "MathProof.ModularForms.MaedaT3GaloisDim10Weights",
  # T₂ Galois dim-2 corner (Gal = S₂ for the six dim-2 T₂ charpolys, closing
  # iteration22-review §6.3): all parents are already default targets and the
  # file is six three-line instances (11 s / 4.7 GiB on Modal) — trio.
  "MathProof.ModularForms.MaedaT2GaloisSmallWeights",
  # HeckeField: the generic eigenvalue-containment layer (every T₂-eigenvalue
  # carries T-eigenvalues into ℚ(μ)) — Mathlib-only imports, 28 s / 3.9 GiB.
  "MathProof.ModularForms.HeckeField",
  # Iteration 23 b3: dim-2 integrality (every T_m an integer polynomial in T₂
  # at the six dim-2 weights; 45 s / 6.3 GiB) and the generic T-Rat layer
  # (every T_m ∈ ℚ[T₂]; 46 s / 4.7 GiB) — all parents are default targets.
  "MathProof.ModularForms.HeckeFieldDim2",
  "MathProof.ModularForms.HeckeFieldRat",
]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # no Mathlib-contribution copyright headers in this project
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc1"

[[lean_lib]]
name = "MathProof"
allowNonModules = true # classic-style files; suppresses the "consider module" warning

# Scaling-study benchmarks (see Bench/README.md) — deliberately OUTSIDE the
# proof library: never imported by MathProof.lean, never built by the default
# target or CI.  Build explicitly, e.g.
#   lake build Bench.Packed.BBenchPackedBal
[[lean_lib]]
name = "Bench"
allowNonModules = true
