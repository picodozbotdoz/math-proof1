name = "MathProof"
version = "0.1.0"
keywords = ["math"]
# Default targets = the light modules only: a bare `lake build` (CI, Reservoir's
# automated builder, downstream consumers) must never pull the heavy kernel-
# decide modules (MathProof.Tau.LehmerMod ~6 GB, MathProof.Tau.LehmerPacked
# ~63 GiB) nor the root `MathProof.lean` / `MathProof.AxCheck` (AxCheck
# transitively imports LehmerMod).  Those are built explicitly on Modal;
# see AGENTS.md.
defaultTargets = [
  "MathProof.Basic",
  "MathProof.Tau.Basic",
  "MathProof.Tau.Lehmer",
  "MathProof.Tau.CongruenceSmall",
  "MathProof.Tau.Bridge",
  "MathProof.ModularForms.Weight12",
  "MathProof.ModularForms.Congruence691",
  "MathProof.ModularForms.HeckeLevelOne",
  "MathProof.Tau.Mordell",
  "MathProof.Tau.LehmerUnbounded",
]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # no Mathlib-contribution copyright headers in this project
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc1"

[[lean_lib]]
name = "MathProof"
allowNonModules = true # classic-style files; suppresses the "consider module" warning

# Scaling-study benchmarks (see Bench/README.md) — deliberately OUTSIDE the
# proof library: never imported by MathProof.lean, never built by the default
# target or CI.  Build explicitly, e.g.
#   lake build Bench.Packed.BBenchPackedBal
[[lean_lib]]
name = "Bench"
allowNonModules = true
