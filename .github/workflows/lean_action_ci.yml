name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # Build the LIGHT modules only — the same list as `defaultTargets` in
      # lakefile.toml, kept in sync per AGENTS.md.  The heavy kernel-decide
      # modules are excluded: MathProof.Tau.LehmerMod (~6 GB heap for its
      # 512 decide), MathProof.Tau.LehmerPacked (~63 GiB), MathProof.Tau.
      # LehmerPow32 (~144 GiB) and their dependents LehmerPrimePower /
      # LehmerGrand, plus MathProof.AxCheck (imports LehmerMod) and the root
      # MathProof.lean — all far beyond the ~7 GB a GitHub runner offers.
      # They are verified on the Modal builder instead (see AGENTS.md):
      # `modal run lean_check.py` / `lean_build.py`.
      - uses: leanprover/lean-action@v1
        with:
          build-args: >-
            MathProof.Tau.Basic
            MathProof.Tau.Lehmer
            MathProof.Tau.CongruenceSmall
            MathProof.Tau.Bridge
            MathProof.ModularForms.Weight12
            MathProof.ModularForms.Congruence691
            MathProof.ModularForms.HeckeLevelOne
            MathProof.Tau.Mordell
            MathProof.Tau.LehmerUnbounded
            MathProof.Tau.PowChain
            MathProof.Tau.LehmerSieve691
            MathProof.Tau.LehmerPrimeReduction
            MathProof.ModularForms.BernoulliHigh
            MathProof.ModularForms.EigenLevelOne
            MathProof.ModularForms.LehmerWeight16
            MathProof.ModularForms.LehmerWeight18
            MathProof.ModularForms.LehmerWeight20
            MathProof.ModularForms.LehmerWeight22
            MathProof.ModularForms.LehmerWeight26
            MathProof.ModularForms.MaedaWeight24
            MathProof.ModularForms.MaedaLevelOne
            MathProof.ModularForms.MaedaSmallWeights
            MathProof.ModularForms.MaedaGalois
            MathProof.ModularForms.MaedaDim4
            MathProof.ModularForms.MaedaDim4Weights
            MathProof.ModularForms.MaedaGalois4
            MathProof.ModularForms.MaedaDim5
            MathProof.ModularForms.MaedaDim5Weights
            MathProof.ModularForms.Poly5
            MathProof.ModularForms.MaedaGalois5Defs
            MathProof.ModularForms.HornerCert
      # GitHub Pages is not enabled on this repository, so the docgen deploy
      # step always fails today; keep it non-fatal until Pages is switched on
      # (Settings -> Pages -> Source: GitHub Actions), then drop this flag.
      - uses: leanprover-community/docgen-action@v1
        continue-on-error: true
