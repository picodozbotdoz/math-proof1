name: Lean Action CI

# Master only (2026-11-01): branch verification happens on Modal
# (lean_check.py overlays the working tree, no push needed).
#
# Selective targets (2026-11-03, iteration 23 review):
# * push     -- the `push` tier of tools/ci_targets.py: `defaultTargets`
#   minus the expensive per-weight certificate families listed in
#   .github/ci-full-only.txt and everything importing them.  Bounded cost
#   even when an ancestor edit invalidates the cache.
# * schedule / workflow_dispatch -- the `full` tier (every default target).
# * Pushes that touch no Lean build input (docs, research, tools) skip CI.
# * One run at a time: a newer push queues behind the running build instead
#   of starting in parallel from a stale cache (the 2026-11-02 docs-only
#   push 51a5eb1 rebuilt Iteration 22 for 51 min that way).  The `.lake`
#   cache (lean-action's GitHub cache) makes unchanged modules free; lake's
#   traces are content-hashed, so a restored cache is always safe.
on:
  push:
    branches: [master]
    paths:
      - "**/*.lean"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/lean_action_ci.yml"
      - ".github/ci-full-only.txt"
      - "tools/ci_targets.py"
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC: full tier (a no-op on a warm cache)
  workflow_dispatch:
    inputs:
      tier:
        description: "push (selective) or full (every default target)"
        required: true
        default: full
        type: choice
        options: [full, push]

concurrency:
  group: lean-ci-${{ github.ref }}
  cancel-in-progress: false

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # The LIGHT modules only (`defaultTargets` in lakefile.toml, the single
      # source of the list).  Heavy kernel-decide modules (LehmerMod,
      # LehmerPacked, LehmerPow32, LehmerPrimePower, LehmerGrand, the
      # MaedaGalois5 chain, AxCheck) and the root MathProof.lean are far
      # beyond a GitHub runner and are verified on Modal (see AGENTS.md).
      - name: Select targets
        id: targets
        run: |
          tier="${{ github.event_name == 'push' && 'push' || inputs.tier || 'full' }}"
          echo "tier=$tier"
          python3 tools/ci_targets.py --report
          list=$(python3 tools/ci_targets.py "$tier")
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - uses: leanprover/lean-action@v1
        with:
          build-args: ${{ steps.targets.outputs.list }}
      # NOTE: no docgen-action step.  It re-ran the whole build a second time
      # and built the doc-gen4 tool and its Mathlib dependency from source
      # (30+ min per push), and its deploy step would overwrite the
      # hand-maintained /docs site (deploy-from-branch) with generated API
      # docs.  The site is served from the docs/ folder by GitHub's own
      # branch-based Pages workflow.  If generated API docs are ever wanted,
      # run docgen as a workflow_dispatch-only job with deploy: false.
